name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # --- 提交规范检查（Conventional Commits，2026-08 治理对齐）---
      # 校验规则唯一权威：scripts/validate-commit-msg.sh（本地 git-hooks 与 CI 共用）
      - name: 提交规范检查（Conventional Commits）
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          count=0
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            count=$((count + 1))
            if ! git show -s --format=%B "$sha" | bash scripts/validate-commit-msg.sh >/dev/null 2>&1; then
              echo "❌ 提交 ${sha:0:7} 不符合 Conventional Commits 规范："
              git show -s --format='   %s' "$sha"
              echo "   规则见 scripts/validate-commit-msg.sh"
              exit 1
            fi
          done
          echo "✅ 全部 $count 个提交符合规范"
      - name: Run full static validation (4 layers)
        run: python tests/run_all_validation.py
      - name: VBA lint (8 rules)
        run: python scripts/vba_lint.py --summary
      - name: Validate manual anchors
        run: python tests/utils/validate_manual_anchors.py
